<!--
  Source for public/og.png, the share card. Regenerate after editing:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --window-size=1200,630 --force-device-scale-factor=1 --hide-scrollbars \
      --screenshot=public/og.png scripts/og-card.html

  The drawing is the mean value theorem, and its geometry is computed rather
  than eyeballed: the curve is f(x) = x + 0.35 sin(2 pi x) sampled over [0, 1],
  the chord joins its endpoints (slope 1), and the tangent is drawn at c = 3/4,
  where f'(c) = 1 + 0.7 pi cos(3 pi / 2) = 1. So the two lines really are
  parallel and the tangent really does touch the curve, which is the whole
  claim of the picture.
-->
